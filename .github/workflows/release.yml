# Each push to main checks the extension, zips it and publishes the zip as a
# GitHub release. The manifest keeps only `<major>.<minor>`. The CI adds the
# number of commits on main as the third part, so each push gets a new,
# higher version and nobody changes it by hand.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, to count the commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The manifest parses, each file that it names exists, each script parses.
      - name: Check
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            if (!/^\d+\.\d+$/.test(m.version))
              throw new Error("manifest version must be <major>.<minor>, not " + m.version);
            const files = [
              `_locales/${m.default_locale}/messages.json`,
              m.background.service_worker,
              ...Object.values(m.icons),
              ...m.content_scripts.flatMap(c => [...(c.js || []), ...(c.css || [])]),
            ];
            const missing = files.filter(f => !fs.existsSync(f));
            if (missing.length) throw new Error("missing: " + missing.join(", "));
          '
          find src lib -name '*.js' -print0 | xargs -0 -n1 node --check

      # The zip gets the full version. The repository keeps `<major>.<minor>`.
      - name: Package
        id: package
        run: |
          version=$(node -p 'require("./manifest.json").version').$(git rev-list --count HEAD)
          VERSION=$version node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            m.version = process.env.VERSION;
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2) + "\n");
          '
          zip="LichessDotCom-v$version.zip"
          # Only the files that Chrome loads: not store/, not tools/.
          zip -r -X -q "$zip" manifest.json _locales icons img lib src -x '*.DS_Store'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LichessDotCom-v${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.zip }}

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          # A manual run on a commit that has a release already.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION has a release already."
            exit 0
          fi
          gh release create "v$VERSION" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "LichessDotCom $VERSION" \
            --generate-notes
