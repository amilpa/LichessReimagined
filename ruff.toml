# Lints and formats the Python tools (tools/).
target-version = 'py312'
line-length = 100

[lint]
# On top of the defaults (pyflakes and pycodestyle's errors):
extend-select = [
  'E', # all of pycodestyle's errors, long lines included
  'W', # its warnings
  'I', # sorted imports
  'N', # PEP 8 names
  'UP', # current syntax for the target version
  'B', # likely bugs (loop variables in closures, zip without strict…)
  'A', # names that shadow builtins
  'C4', # comprehensions
  'SIM', # simpler forms
  'PIE',
  'PTH', # pathlib rather than os.path
  'NPY', # deprecated numpy
  'RUF',
]

# The multiplication sign in '2×2' and in array shapes is meant.
allowed-confusables = ['×']

[format]
quote-style = 'single'
