<!doctype html>
<meta charset="utf-8">
<meta name="size" content="128x128">
<meta name="icons" content="16,48,128">
<style>
  html,
  body {
    margin: 0;
    width: 128px;
    height: 128px;
    overflow: hidden;
    background: transparent;
  }

  /* Chrome's guidelines: 96px of art in the 128px icon, the rest clear.
     The small ones have no room to spare, so they fill theirs. */
  svg {
    display: block;
    width: 96px;
    height: 96px;
    margin: 16px;
  }

  @media (resolution < 0.5dppx) {
    svg {
      width: 128px;
      height: 128px;
      margin: 0;
    }
  }
</style>

<svg viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#95c65a"/>
      <stop offset="0.5" stop-color="#6ea749"/>
      <stop offset="1" stop-color="#4f853e"/>
    </linearGradient>
    <linearGradient id="pawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e4e4de"/>
    </linearGradient>
    <clipPath id="clip"><rect width="100" height="100" rx="22"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1f3d17" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="100" height="100" fill="url(#tile)"/>
    <!-- a board's squares, faint -->
    <path d="M50 0h25v25H50zM75 25h25v25H75zM0 50h25v25H0zM25 75h25v25H25z" fill="#fff" opacity="0.07"/>
    <path d="M0 0h25v25H0zM25 25h25v25H25zM50 50h25v25H50zM75 75h25v25H75z" fill="#000" opacity="0.05"/>
    <!-- the tile's lit top edge and dark bottom one -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="none" stroke="#b9e27f" stroke-opacity="0.55" stroke-width="3" transform="translate(0 1.5)" clip-path="url(#clip)"/>
    <rect x="0" y="-3" width="100" height="100" rx="22" fill="none" stroke="#2f5a26" stroke-opacity="0.5" stroke-width="3"/>
  </g>

  <!-- a chunky pawn, drawn for the icon -->
  <g filter="url(#shadow)" fill="url(#pawn)" stroke="#2c2a26" stroke-opacity="0.2" stroke-width="1.2" stroke-linejoin="round">
    <path d="M40.5 47 C40.5 58 35 66 29.5 74 H70.5 C65 66 59.5 58 59.5 47 Z"/>
    <rect x="33" y="40" width="34" height="9" rx="4.5"/>
    <circle cx="50" cy="27.5" r="14"/>
    <rect x="22" y="73" width="56" height="12" rx="5"/>
  </g>
</svg>
