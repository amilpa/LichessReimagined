<!doctype html>
<meta charset="utf-8">

<link rel="stylesheet" href="store.css">
<style>
  body {
    --w: 1280px;
    --h: 800px;
    --glow-x: 50%;
    --grid-x: 50%;
    --grid-y: 0%;
  }

  header {
    position: absolute;
    top: 50px;
    left: 0;
    right: 0;
    display: grid;
    justify-items: center;
    gap: 16px;
    text-align: center;
  }

  h1 {
    font-size: 62px;
  }

  .window {
    top: 262px;
    left: 130px;
    width: 1020px;
  }

  .c1 { top: 575px; left: 52px; transform: rotate(-4deg); }
  .c2 { top: 640px; right: 44px; transform: rotate(-3deg); }
  .c3 { top: 330px; right: 40px; transform: rotate(3deg); }
</style>

<header>
  <span class="pill"><span class="dot"></span>Free · No ads · Open source</span>
  <h1>Lichess, the look <em>you know</em></h1>
  <p class="sub">The green board, the pieces, the sounds and the layout you're used to, on Lichess.</p>
</header>

<div class="window">
