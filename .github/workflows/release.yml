# Chaque push sur main vérifie l'extension et en fait un zip (artefact du run).
# Quand la version du manifest n'a pas encore de release, le zip est publié
# dans une release GitHub `v<version>` : pour publier, montez `version`.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Le manifest se lit, chaque fichier qu'il cite existe, chaque script se parse.
      - name: Check
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const files = [
              m.background.service_worker,
              ...Object.values(m.icons),
              ...m.content_scripts.flatMap(c => [...(c.js || []), ...(c.css || [])]),
            ];
            const missing = files.filter(f => !fs.existsSync(f));
            if (missing.length) throw new Error("missing: " + missing.join(", "));
          '
          find src lib -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Package
        id: package
        run: |
          version=$(node -p 'require("./manifest.json").version')
          zip="LichessDotCom-v$version.zip"
          # Seul ce que Chrome charge : ni store/, ni tools/.
          zip -r -X -q "$zip" manifest.json icons img lib src -x '*.DS_Store'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LichessDotCom-v${{ steps.package.outputs.version }}-${{ github.sha }}
          path: ${{ steps.package.outputs.zip }}

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION est déjà publiée : montez la version du manifest pour une nouvelle release."
            exit 0
          fi
          gh release create "v$VERSION" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "LichessDotCom $VERSION" \
            --generate-notes
