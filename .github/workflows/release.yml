# Each push to main checks the extension, zips it (for Chrome, the Chrome Web
# Store and Firefox) and publishes the zips as a GitHub release. The manifest keeps only `<major>.<minor>`. The CI adds the
# number of commits on main as the third part, so each push gets a new,
# higher version and nobody changes it by hand.
#
# A `store-<version>` tag on a commit of main (`store-0.1.295`: the version
# this commit gets) packages that commit the same way and sends its store zip
# to the Chrome Web Store, for review.
name: Release

on:
  push:
    branches: [main]
    tags: ['store-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A tag gets its own group: a push to main would otherwise cancel it while
  # it waits.
  group: ${{ github.ref_type == 'tag' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      store_zip: ${{ steps.package.outputs.store_zip }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, to count the commits.
          fetch-depth: 0

      # The version counts the commits on main, so it only means something there.
      - name: On main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main: push the commit to main first."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The manifest parses, each file that it names exists, each script parses.
      - name: Check
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            if (!/^\d+\.\d+$/.test(m.version))
              throw new Error("manifest version must be <major>.<minor>, not " + m.version);
            const files = [
              `_locales/${m.default_locale}/messages.json`,
              m.background.service_worker,
              ...Object.values(m.icons),
              ...m.content_scripts.flatMap(c => [...(c.js || []), ...(c.css || [])]),
            ];
            const missing = files.filter(f => !fs.existsSync(f));
            if (missing.length) throw new Error("missing: " + missing.join(", "));
          '
          find src lib -name '*.js' -print0 | xargs -0 -n1 node --check

      # The zip gets the full version. The repository keeps `<major>.<minor>`.
      - name: Package
        id: package
        run: |
          version=$(node -p 'require("./manifest.json").version').$(git rev-list --count HEAD)
          VERSION=$version node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            m.version = process.env.VERSION;
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2) + "\n");
          '
          zip="LichessDotCom-v$version.zip"
          # Only the files that Chrome loads: not store/, not tools/.
          files="manifest.json _locales icons img lib sounds src"
          zip -r -X -q "$zip" $files -x '*.DS_Store'
          # The Chrome Web Store's package: the same, without the storage
          # permission. Only an unpacked install uses it (its auto-reload),
          # and the store turns down a permission its installs don't need.
          store_zip="LichessDotCom-v$version-store.zip"
          mkdir store-build
          cp -R $files store-build/
          node -e '
            const fs = require("fs");
            const path = "store-build/manifest.json";
            const m = JSON.parse(fs.readFileSync(path, "utf8"));
            m.permissions = (m.permissions || []).filter(p => p !== "storage");
            if (!m.permissions.length) delete m.permissions;
            fs.writeFileSync(path, JSON.stringify(m, null, 2) + "\n");
          '
          (cd store-build && zip -r -X -q "../$store_zip" . -x '*.DS_Store')
          # The Firefox package (tools/firefox/build.mjs): background scripts
          # for the service worker, a gecko id, moz-extension:// in the CSS.
          firefox_zip="LichessDotCom-v$version-firefox.zip"
          node tools/firefox/build.mjs firefox-build --version "$version"
          (cd firefox-build && zip -r -X -q "../$firefox_zip" . -x '*.DS_Store')
          # A store tag names the version it sends, so a tag on the wrong
          # commit stops here.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "store-$version" ]; then
            echo "::error::this commit is $version: its tag must be store-$version, not $GITHUB_REF_NAME."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "store_zip=$store_zip" >> "$GITHUB_OUTPUT"
          echo "firefox_zip=$firefox_zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LichessDotCom-v${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.store_zip }}
            ${{ steps.package.outputs.firefox_zip }}

      # A tag only goes to the store: the push to main makes the release.
      - name: Release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
          STORE_ZIP: ${{ steps.package.outputs.store_zip }}
          FIREFOX_ZIP: ${{ steps.package.outputs.firefox_zip }}
        run: |
          # A manual run on a commit that has a release already.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION has a release already."
            exit 0
          fi
          gh release create "v$VERSION" "$ZIP" "$STORE_ZIP" "$FIREFOX_ZIP" \
            --target "$GITHUB_SHA" \
            --title "LichessDotCom $VERSION" \
            --generate-notes

  store:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: LichessDotCom-v${{ needs.release.outputs.version }}

      - name: Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: >
          node tools/store/publish.mjs
          "${{ needs.release.outputs.store_zip }}"
          "${{ needs.release.outputs.version }}"
