<!doctype html>
<meta charset="utf-8">
<meta name="size" content="1280x800">
<link rel="stylesheet" href="store.css">
<style>
  body {
    --w: 1280px;
    --h: 800px;
    --glow-x: 50%;
    --grid-x: 50%;
    --grid-y: 0%;
  }

  header {
    position: absolute;
    top: 44px;
    left: 0;
    right: 0;
    display: grid;
    justify-items: center;
    gap: 14px;
    text-align: center;
  }

  /* Three pages as cards, like a bento box. */
  .card {
    position: absolute;
    overflow: hidden;
    border-radius: 16px;
    box-shadow: 0 0 0 1px #ffffff1f, var(--shadow);
  }

  .card .chip {
    position: absolute;
    right: 14px;
    bottom: 14px;
    padding: 6px 14px 6px 6px;
    font-size: 15px;
  }

  .card .chip .tile {
    width: 26px;
    height: 26px;
    border-radius: 8px;
  }

  .card .chip svg {
    width: 16px;
    height: 16px;
  }

  .home { top: 262px; left: 48px; }
  .practice { top: 262px; left: 708px; }
  .profile { top: 506px; left: 708px; }
</style>

<header>
  <span class="pill"><span class="dot"></span>The whole site</span>
  <h1>Every page, <em>redesigned</em></h1>
  <p class="sub">Home, puzzles, lessons, profiles, tournaments, forums: modern and playful.</p>
</header>

<div class="card home">
  <div class="crop" style="--s: 0.5178; --x: 190; --y: 15; --cw: 1236; --ch: 900"><img src="shots/home.webp"></div>
  <span class="chip"><span class="tile" style="--c: #81b64c"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg></span>Home</span>
</div>

<div class="card practice">
  <div class="crop" style="--s: 0.424; --x: 190; --y: 15; --cw: 1236; --ch: 529"><img src="shots/practice.webp"></div>
  <span class="chip"><span class="tile" style="--c: #e8543c"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span>Practice</span>
</div>

<div class="card profile">
  <div class="crop" style="--s: 0.424; --x: 190; --y: 20; --cw: 1236; --ch: 520"><img src="shots/profile.webp"></div>
  <span class="chip"><span class="tile" style="--c: #749bbf"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-3 0-8 1.5-8 4.5V20h16v-1.5c0-3-5-4.5-8-4.5z"/></svg></span>Profiles</span>
</div>
